stages:
  - build
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

include:
  - component: $CI_SERVER_FQDN/devooops/gitlab/pipeline-catalog/templates/docker-buildx-push@main
    inputs:
      job_name: 🛠️ docker build backend
      image_name: workflow-manager-backend
      image_tag: $CI_COMMIT_SHORT_SHA
      docker_buildx_context: ./backend
      docker_repository_url: $DOCKER_REGISTRY_URL
      docker_repository_project: $DOCKER_REGISTRY_PROJECT

  - component: $CI_SERVER_FQDN/devooops/gitlab/pipeline-catalog/templates/docker-buildx-push@main
    inputs:
      job_name: 🛠️ docker build frontend
      image_name: workflow-manager-frontend
      image_tag: $CI_COMMIT_SHORT_SHA
      docker_buildx_context: ./frontend
      docker_repository_url: $DOCKER_REGISTRY_URL
      docker_repository_project: $DOCKER_REGISTRY_PROJECT
