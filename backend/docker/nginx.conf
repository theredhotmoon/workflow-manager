# The readiness probe (/api/health) is left out of the access log: the healthcheck calls it every
# 10 s. Matched on the original URI, because try_files hands the request on to the .php location.
map $request_uri $access_loggable {
    ~^/api/health(\?|$)  0;
    default              1;
}

server {
    listen      8080;
    server_name _;
    root        /var/www/html/public;
    index       index.php;

    add_header X-Frame-Options   "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    charset utf-8;

    # Request bodies: 2 MB (413 above it), login and every other endpoint included. Only the
    # procedure writes below take more. The frontend Nginx has the same limits.
    client_max_body_size 2M;

    # PHP over FastCGI, for the .php location and the procedure writes.
    fastcgi_read_timeout    300;
    fastcgi_buffers         16 16k;
    fastcgi_buffer_size     32k;

    # Liveness of this Nginx only (static, no PHP, no database). Readiness, which the compose
    # healthcheck and CI use, is /api/health (HealthController).
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Procedure create, update and draft save (POST /api/procedures, PUT /api/procedures/{id} and
    # /{id}/draft): pasted images are stored inside the HTML as base64 data: URLs, so these bodies
    # can be large. 50 MB, as PHP's post_max_size (docker/php.ini); the content itself is capped
    # below that (Procedure::CONTENT_MAX_LENGTH, a 422). Sent to PHP from here (rewrite ... break
    # stays in this location): a try_files redirect would end in the .php location and its 2 MB.
    location ~ ^/api/procedures(/[0-9]+(/draft)?)?$ {
        client_max_body_size    50M;
        rewrite                 ^ /index.php break;
        fastcgi_pass            127.0.0.1:9000;
        fastcgi_param           SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include                 fastcgi_params;
    }

    location ~ \.php$ {
        fastcgi_pass            127.0.0.1:9000;
        fastcgi_index           index.php;
        fastcgi_param           SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include                 fastcgi_params;
    }

    # Deny access to hidden files
    location ~ /\.(?!well-known).* {
        deny all;
    }

    error_log  /dev/stderr warn;
    access_log /dev/stdout main if=$access_loggable;
}
