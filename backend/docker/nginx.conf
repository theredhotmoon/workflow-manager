# The readiness probe (/api/health) is left out of the access log: the healthcheck calls it every
# 10 s. Matched on the original URI, because try_files hands the request on to the .php location.
map $request_uri $access_loggable {
    ~^/api/health(\?|$)  0;
    default              1;
}

server {
    listen      8080;
    server_name _;
    root        /var/www/html/public;
    index       index.php;

    add_header X-Frame-Options   "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    charset utf-8;

    # Same as PHP's post_max_size/upload_max_filesize (docker/php.ini) and the frontend Nginx, so a
    # large procedure (pasted images are data: URLs inside the HTML) isn't cut off at Nginx's 1 MB
    # default with a 413.
    client_max_body_size 50M;

    # Liveness of this Nginx only (static, no PHP, no database). Readiness, which the compose
    # healthcheck and CI use, is /api/health (HealthController).
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass            127.0.0.1:9000;
        fastcgi_index           index.php;
        fastcgi_param           SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include                 fastcgi_params;
        fastcgi_read_timeout    300;
        fastcgi_buffers         16 16k;
        fastcgi_buffer_size     32k;
    }

    # Deny access to hidden files
    location ~ /\.(?!well-known).* {
        deny all;
    }

    error_log  /dev/stderr warn;
    access_log /dev/stdout main if=$access_loggable;
}
