; php-fpm's own access log is off. The base image (php-fpm.d/docker.conf) sends it to stderr, and it
; can't skip a path, so it logged every /api/health probe (every 10 s). Nginx already logs each
; request, without the probe (docker/nginx.conf). Copied after docker.conf, so this value wins.
;
; Errors are unchanged: the master's error_log stays /proc/self/fd/2 (stderr), and the workers'
; output (PHP errors, Laravel's LOG_CHANNEL=stderr) still reaches it via catch_workers_output.
[www]
access.log = /dev/null
