; ── OPcache (production settings) ──────────────────────────────────────────
opcache.enable=1
opcache.revalidate_freq=0
opcache.validate_timestamps=0
opcache.max_accelerated_files=20000
opcache.memory_consumption=256
opcache.max_wasted_percentage=10
opcache.interned_strings_buffer=16
opcache.fast_shutdown=1

; ── Upload / execution limits ────────────────────────────────────────────────
; post_max_size is the largest body any route takes: the procedure writes (pasted images inside the
; HTML), which Nginx lets through up to 50M; every other route is held to 2M by Nginx
; (docker/nginx.conf). No endpoint takes file uploads, so upload_max_filesize stays small.
upload_max_filesize = 2M
post_max_size       = 50M
memory_limit        = 256M
max_execution_time  = 300
max_input_time      = 300

; ── Logging ──────────────────────────────────────────────────────────────────
error_reporting  = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors   = Off
log_errors       = On
error_log        = /dev/stderr
