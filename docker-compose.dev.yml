# ── Hybrid dev override ──────────────────────────────────────────────────────
# Use alongside docker-compose.yml to run only `db` + `backend` in containers,
# while the frontend runs locally via `npm run dev:hybrid` (Vite, see
# frontend/vite.config.hybrid.js).
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d db backend
#
# Full-Docker mode (all three services, including frontend) is unaffected —
# just run `docker compose up -d --build` as before, without this file.
#
# Exposes the backend on a host port (it has none in the production compose
# file, since prod traffic reaches it through the frontend Nginx container),
# and relaxes a few settings for local development.
services:
  backend:
    ports:
      # Loopback only: this backend runs with APP_DEBUG=true (stack traces, env details), so it must
      # not be reachable from the network. Vite's proxy and the e2e suite connect from this machine.
      - "127.0.0.1:${BACKEND_PORT:-8090}:8080"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      # Same as production: Laravel's log goes to `docker compose logs backend` (rotated).
      LOG_CHANNEL: stderr
      LOG_LEVEL: debug
      # Local dev and the e2e suite share one user, so don't throttle them at the production 60/min.
      API_RATE_LIMIT: ${API_RATE_LIMIT:-1000}
      # Always append the Vite dev server origins, so Sanctum's SPA cookie auth
      # accepts them regardless of whatever SANCTUM_STATEFUL_DOMAINS is set to
      # in the root .env (which may not include them). Any localhost port is
      # accepted (Sanctum matches with wildcards), so the e2e suite can run its
      # dev server on another port (E2E_PORT) next to one already using 5173.
      # Dev compose only — production keeps an explicit list.
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost},localhost:5173,localhost:*
      SESSION_DOMAIN: ${SESSION_DOMAIN:-localhost}
      # Dev runs over plain http://localhost, where a Secure cookie would never be sent back.
      SESSION_SECURE_COOKIE: "false"
