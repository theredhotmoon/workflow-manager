# Docker's json-file log driver, rotated: at most 5 × 10 MB per container (the default keeps
# growing until the disk is full). Every service logs to stdout/stderr.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:

  # ─── PostgreSQL ────────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: shift_changer_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_DATABASE:-shift_changer}
      POSTGRES_USER:     ${DB_USERNAME:-postgres}
      # No defaults for secrets: compose refuses to start until .env sets them (see .env.example).
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app_network
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-shift_changer}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Laravel API (PHP-FPM + Nginx) ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shift_changer_backend
    restart: unless-stopped
    environment:
      APP_NAME:    "Shift Changer"
      APP_ENV:     production
      APP_DEBUG:   "false"
      APP_KEY:     ${APP_KEY:?set APP_KEY in .env}
      APP_URL:     ${APP_URL:-http://localhost}

      DB_CONNECTION: pgsql
      DB_HOST:       db
      DB_PORT:       5432
      DB_DATABASE:   ${DB_DATABASE:-shift_changer}
      DB_USERNAME:   ${DB_USERNAME:-postgres}
      DB_PASSWORD:   ${DB_PASSWORD:?set DB_PASSWORD in .env}

      # Max API requests per minute, per user (HTTP 429 beyond that)
      API_RATE_LIMIT: ${API_RATE_LIMIT:-60}
      # The organisation's timezone: what "today" means for business rules
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Europe/Warsaw}

      # Failed logins per minute for one email from one client IP (HTTP 429 beyond that)
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-5}
      # Proxies whose X-Forwarded-For is believed; empty = the private ranges (this compose network)
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}

      LOG_CHANNEL: stderr
      LOG_LEVEL:   warning

      CACHE_DRIVER:      file
      SESSION_DRIVER:    file
      # true = session cookie only over HTTPS. Set it once TLS is in front of the stack (README).
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
      QUEUE_CONNECTION:  sync

      # Allow the frontend container (same-origin via Nginx proxy) as stateful domain
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost}

      # Migrations run on every container start (docker/entrypoint.sh). 0 = skip them, for a deploy
      # that runs them as a separate step (README, "Migrations").
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-1}
      # 1 = pg_dump the database to storage/app/backups (backend_storage volume) before migrating,
      # whenever migrations are pending.
      BACKUP_BEFORE_MIGRATE: ${BACKUP_BEFORE_MIGRATE:-0}
    volumes:
      # Logs go to stderr (LOG_CHANNEL above) and so to Docker's rotated log, not to a volume.
      - backend_storage:/var/www/html/storage/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network
    logging: *default-logging
    # Ready = PHP answers and the database accepts a query (/api/health; 503 otherwise). The start
    # period covers the migrations run on start.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s

  # ─── Vue 3 SPA (Nginx) ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shift_changer_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    # Nginx resolves the `backend` upstream when it starts, and has nothing to serve /api from
    # before the backend is ready.
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_network
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  db_data:
  backend_storage:

networks:
  app_network:
    driver: bridge
