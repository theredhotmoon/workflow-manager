services:

  # ─── PostgreSQL ────────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: shift_changer_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_DATABASE:-shift_changer}
      POSTGRES_USER:     ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-shift_changer}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Laravel API (PHP-FPM + Nginx) ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shift_changer_backend
    restart: unless-stopped
    environment:
      APP_NAME:    "Shift Changer"
      APP_ENV:     production
      APP_DEBUG:   "false"
      APP_KEY:     ${APP_KEY}
      APP_URL:     ${APP_URL:-http://localhost}

      DB_CONNECTION: pgsql
      DB_HOST:       db
      DB_PORT:       5432
      DB_DATABASE:   ${DB_DATABASE:-shift_changer}
      DB_USERNAME:   ${DB_USERNAME:-postgres}
      DB_PASSWORD:   ${DB_PASSWORD:-secret}

      LOG_CHANNEL: stderr
      LOG_LEVEL:   warning

      CACHE_DRIVER:      file
      SESSION_DRIVER:    file
      QUEUE_CONNECTION:  sync

      # Allow the frontend container (same-origin via Nginx proxy) as stateful domain
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost}
    volumes:
      - backend_storage:/var/www/html/storage/app
      - backend_logs:/var/www/html/storage/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

  # ─── Vue 3 SPA (Nginx) ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shift_changer_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - app_network

volumes:
  db_data:
  backend_storage:
  backend_logs:

networks:
  app_network:
    driver: bridge
