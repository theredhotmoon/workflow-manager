server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Request bodies: 2 MB (413 above it), login and every other endpoint included. Only the
    # procedure writes (below, in the API proxy) take up to 50 MB. Same limits as the backend Nginx.
    client_max_body_size 2M;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ── Proxy: Laravel API ────────────────────────────────────────────────────
    # All /api/* and /sanctum/* requests are forwarded to the backend container.
    # Because requests arrive on the same origin (port 80), CORS is not needed.
    #
    # This Nginx is the edge: X-Forwarded-For is SET to the address the client connected from, never
    # appended to. The backend trusts this container (private ranges, TRUSTED_PROXIES), so an
    # appended chain would let a client that reaches Nginx from a private address (LAN, IPv6 via
    # docker-proxy, Docker Desktop, rootless Docker) pick its own IP with a forged header and dodge
    # the login and API rate limits.
    #
    # Behind a TLS-terminating proxy (README, "HTTPS in production"), $remote_addr is that proxy.
    # To see the real client, uncomment and set its address (only the proxy's, never 0.0.0.0/0):
    #   set_real_ip_from  10.0.0.5;          # the outer proxy (IP or CIDR); one line per proxy
    #   real_ip_header    X-Forwarded-For;
    #   real_ip_recursive on;
    # $remote_addr then becomes the client the proxy saw, and the line below forwards it.
    location ~ ^/(api|sanctum)/ {
        # A procedure request other than POST/PUT, sent back here by the location at the end of
        # this block: the prefix comes off and it is proxied as is, under this block's 2 MB. Only
        # the three procedure paths map back; anything else under the prefix is refused.
        rewrite            ^/api/_2m(/api/procedures(?:/[0-9]+(?:/draft)?)?)$ $1 break;
        if ($uri ~ ^/api/_2m/) {
            return 404;
        }
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        # $scheme is this Nginx's (http). Behind a TLS proxy that sets X-Forwarded-Proto, use
        #   proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # instead (only then: without an outer proxy a client could claim https).
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout  300;
        proxy_send_timeout  300;
        proxy_connect_timeout 10;

        # Procedure create, update and draft save: pasted images are data: URLs inside the HTML,
        # so POST and PUT here take up to 50 MB (backend/docker/nginx.conf and php.ini allow the
        # same). Any other method goes back through this block under an internal /api/_2m prefix
        # (rewrite ... last re-checks the body there, against 2 MB). The headers and timeouts above
        # are inherited; proxy_pass is not, so it is repeated.
        location ~ ^/api/procedures(/[0-9]+(/draft)?)?$ {
            if ($request_method !~ ^(POST|PUT)$) {
                rewrite          ^ /api/_2m$uri last;
            }
            client_max_body_size 50M;
            proxy_pass           http://backend:8080;
        }
    }

    # ── Vue SPA ───────────────────────────────────────────────────────────────
    # Any path that doesn't match a real file falls back to index.html
    # so that Vue Router can handle it client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Static asset caching ─────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        # Its own add_header above drops the server-level ones; a directly opened .svg is a document.
        include /etc/nginx/security-headers.conf;
        access_log off;
    }

    # ── Security headers ─────────────────────────────────────────────────────
    # X-Frame-Options, nosniff, Referrer-Policy and the Content-Security-Policy: see
    # docker/security-headers.conf (copied next to nginx.conf by the Dockerfile).
    include /etc/nginx/security-headers.conf;

    error_log  /dev/stderr warn;
    access_log /dev/stdout combined;
}
