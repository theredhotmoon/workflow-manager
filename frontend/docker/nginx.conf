server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ── Proxy: Laravel API ────────────────────────────────────────────────────
    # All /api/* and /sanctum/* requests are forwarded to the backend container.
    # Because requests arrive on the same origin (port 80), CORS is not needed.
    #
    # This Nginx is the edge: X-Forwarded-For is SET to the address the client connected from, never
    # appended to. The backend trusts this container (private ranges, TRUSTED_PROXIES), so an
    # appended chain would let a client that reaches Nginx from a private address (LAN, IPv6 via
    # docker-proxy, Docker Desktop, rootless Docker) pick its own IP with a forged header and dodge
    # the login and API rate limits.
    #
    # Behind a TLS-terminating proxy (README, "HTTPS in production"), $remote_addr is that proxy.
    # To see the real client, uncomment and set its address (only the proxy's, never 0.0.0.0/0):
    #   set_real_ip_from  10.0.0.5;          # the outer proxy (IP or CIDR); one line per proxy
    #   real_ip_header    X-Forwarded-For;
    #   real_ip_recursive on;
    # $remote_addr then becomes the client the proxy saw, and the line below forwards it.
    location ~ ^/(api|sanctum)/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        # $scheme is this Nginx's (http). Behind a TLS proxy that sets X-Forwarded-Proto, use
        #   proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # instead (only then: without an outer proxy a client could claim https).
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout  300;
        proxy_send_timeout  300;
        proxy_connect_timeout 10;
    }

    # ── Vue SPA ───────────────────────────────────────────────────────────────
    # Any path that doesn't match a real file falls back to index.html
    # so that Vue Router can handle it client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Static asset caching ─────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Security headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options      "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"   always;
    add_header X-XSS-Protection     "1; mode=block" always;
    add_header Referrer-Policy      "strict-origin-when-cross-origin" always;
    # Content Security Policy for the SPA: only its own scripts run (no inline or injected ones), so
    # markup that slips into procedure content cannot execute. Styles allow inline (Vue style
    # bindings, the TipTap editor injects a <style>); images allow data: and any https host
    # (procedures embed pasted and linked images); the API is same-origin. A location below that
    # sets its own add_header (static assets) does not inherit these; only documents need them.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    error_log  /dev/stderr warn;
    access_log /dev/stdout combined;
}
