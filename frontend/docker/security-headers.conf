# Security headers for every response of the frontend Nginx. Included at server level and again in
# every location that sets its own add_header (nginx drops inherited add_header directives there).
add_header X-Frame-Options        "SAMEORIGIN"  always;
add_header X-Content-Type-Options "nosniff"     always;
add_header X-XSS-Protection       "1; mode=block" always;
add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
# Content Security Policy for the SPA: only its own scripts run (no inline or injected ones), so
# markup that slips into procedure content cannot execute. Styles allow inline (Vue style bindings,
# the TipTap editor injects a <style>); images allow data: and any https host (procedures embed
# pasted and linked images); the API is same-origin.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
